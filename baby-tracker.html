<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👶 新生儿护理记录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            border: none;
            background: none;
        }

        .tab.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        .tab:hover {
            background: #e9ecef;
        }

        .content {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #495057;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            margin-top: 10px;
        }

        .records {
            margin-top: 30px;
        }

        .records h2 {
            font-size: 18px;
            color: #495057;
            margin-bottom: 15px;
        }

        .record-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .record-item.feeding {
            border-left-color: #4CAF50;
        }

        .record-item.sleeping {
            border-left-color: #2196F3;
        }

        .record-item.diaper {
            border-left-color: #FF9800;
        }

        .record-time {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .record-content {
            font-size: 16px;
            font-weight: 500;
        }

        .record-note {
            font-size: 14px;
            color: #6c757d;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
            }

            .header h1 {
                font-size: 24px;
            }

            .tab {
                padding: 12px 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👶 新生儿护理记录</h1>
            <p>记录宝宝的每一次成长</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('feeding')">🍼 吃奶</button>
            <button class="tab" onclick="switchTab('sleeping')">😴 睡眠</button>
            <button class="tab" onclick="switchTab('diaper')">💩 排便</button>
        </div>

        <div class="content">
            <!-- 吃奶表单 -->
            <div id="feeding-form" class="form-section active">
                <div class="form-group">
                    <label>喂养类型</label>
                    <select id="feeding-type">
                        <option value="母乳">🤱 母乳</option>
                        <option value="配方奶">🍼 配方奶</option>
                        <option value="混合">🔄 混合</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>喂养量 (ml)</label>
                    <input type="number" id="feeding-amount" placeholder="例如: 120">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="feeding-note" placeholder="左/右侧，吃奶时长等..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="addRecord('feeding')">
                    <span class="icon-btn">💾 保存吃奶记录</span>
                </button>
            </div>

            <!-- 睡眠表单 -->
            <div id="sleeping-form" class="form-section">
                <div class="form-group">
                    <label>状态</label>
                    <select id="sleeping-status">
                        <option value="入睡">😴 入睡</option>
                        <option value="醒来">🌅 醒来</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="sleeping-note" placeholder="睡眠环境，入睡方式等..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="addRecord('sleeping')">
                    <span class="icon-btn">💾 保存睡眠记录</span>
                </button>
            </div>

            <!-- 排便表单 -->
            <div id="diaper-form" class="form-section">
                <div class="form-group">
                    <label>类型</label>
                    <select id="diaper-type">
                        <option value="便便">💩 便便</option>
                        <option value="尿尿">💧 尿尿</option>
                        <option value="混合">🔄 混合</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="diaper-note" placeholder="颜色、质地等..."></textarea>
                </div>
                <button class="btn btn-primary" onclick="addRecord('diaper')">
                    <span class="icon-btn">💾 保存排便记录</span>
                </button>
            </div>

            <!-- 历史记录 -->
            <div class="records">
                <h2>📋 最近记录</h2>
                <div id="records-list"></div>
            </div>

            <button class="btn btn-danger" onclick="clearAllRecords()">🗑️ 清空所有记录</button>
        </div>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('babyRecords') || '[]');

        function switchTab(type) {
            // 切换标签样式
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // 切换表单显示
            document.querySelectorAll('.form-section').forEach(section => section.classList.remove('active'));
            document.getElementById(`${type}-form`).classList.add('active');
        }

        function addRecord(type) {
            const now = new Date();
            const timestamp = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            const record = {
                id: Date.now(),
                type: type,
                time: timestamp,
                note: ''
            };

            if (type === 'feeding') {
                record.feedingType = document.getElementById('feeding-type').value;
                record.amount = document.getElementById('feeding-amount').value;
                record.note = document.getElementById('feeding-note').value;
            } else if (type === 'sleeping') {
                record.sleepStatus = document.getElementById('sleeping-status').value;
                record.note = document.getElementById('sleeping-note').value;
            } else if (type === 'diaper') {
                record.diaperType = document.getElementById('diaper-type').value;
                record.note = document.getElementById('diaper-note').value;
            }

            records.unshift(record);
            saveRecords();
            renderRecords();
            clearForm(type);

            // 显示成功提示
            showToast('记录已保存！');
        }

        function clearForm(type) {
            if (type === 'feeding') {
                document.getElementById('feeding-amount').value = '';
                document.getElementById('feeding-note').value = '';
            } else if (type === 'sleeping') {
                document.getElementById('sleeping-note').value = '';
            } else if (type === 'diaper') {
                document.getElementById('diaper-note').value = '';
            }
        }

        function saveRecords() {
            localStorage.setItem('babyRecords', JSON.stringify(records));
        }

        function renderRecords() {
            const container = document.getElementById('records-list');

            if (records.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <p>暂无记录，开始记录吧！</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = records.slice(0, 50).map(record => {
                let icon = '';
                let content = '';

                if (record.type === 'feeding') {
                    icon = '🍼';
                    content = `${record.feedingType}`;
                    if (record.amount) content += ` ${record.amount}ml`;
                } else if (record.type === 'sleeping') {
                    icon = '😴';
                    content = record.sleepStatus;
                } else if (record.type === 'diaper') {
                    icon = '💩';
                    content = record.diaperType;
                }

                return `
                    <div class="record-item ${record.type}">
                        <div class="record-time">${record.time}</div>
                        <div class="record-content">${icon} ${content}</div>
                        ${record.note ? `<div class="record-note">📝 ${record.note}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function clearAllRecords() {
            if (confirm('确定要清空所有记录吗？此操作不可恢复！')) {
                records = [];
                saveRecords();
                renderRecords();
                showToast('所有记录已清空！');
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0,0,0,0.8);
                color: white;
                padding: 12px 24px;
                border-radius: 25px;
                z-index: 1000;
                animation: fadeIn 0.3s;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // 添加动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
                to { opacity: 1; transform: translateX(-50%) translateY(0); }
            }
            @keyframes fadeOut {
                from { opacity: 1; }
                to { opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // 初始化显示
        renderRecords();
    </script>
</body>
</html>
